[tool.ruff]
line-length = 130
target-version = "py312"
extend-exclude = ["docs", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["car"]
combine-as-imports = true

[tool.pymarkdown]
plugins.md013.enabled = false

[tool.pytest.ini_options]
testpaths = ["tests"]
